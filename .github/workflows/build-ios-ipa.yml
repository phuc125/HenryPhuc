name: Build Unsigned iOS IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-web:
    name: Build Web Bundle (Fast Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies & Build Web
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm install react-is --legacy-peer-deps --no-audit --no-fund
          npm run build

      - name: Upload Web Build (dist)
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          retention-days: 1

  build-unsigned-ipa:
    name: Build SolSniperAI-Unsigned.ipa
    needs: build-web
    runs-on: macos-14

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Download Web Build (dist)
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Capacitor CLI & Sync iOS
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npx cap sync ios

      - name: Resolve Swift Package Dependencies & Build Unsigned App
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Package Payload into SolSniperAI-Unsigned.ipa
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/App.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Built App.app not found at $APP_PATH"
            exit 1
          fi
          rm -rf "$RUNNER_TEMP/ipa_stage"
          mkdir -p "$RUNNER_TEMP/ipa_stage/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa_stage/Payload/SolSniperAI.app"
          cd "$RUNNER_TEMP/ipa_stage"
          zip -qry "$RUNNER_TEMP/SolSniperAI-Unsigned.ipa" Payload
          ls -lh "$RUNNER_TEMP/SolSniperAI-Unsigned.ipa"

      - name: Upload Unsigned .IPA Artifact (AltStore / SideStore / Sideloadly)
        uses: actions/upload-artifact@v4
        with:
          name: SolSniperAI-Unsigned-IPA
          path: ${{ runner.temp }}/SolSniperAI-Unsigned.ipa
          retention-days: 30
